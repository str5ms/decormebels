<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — заявки Decor Mebel KZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand" href="index.html"><small>Decor</small><strong>MEBEL<span>KZ</span></strong></a>
      <nav class="admin-menu" aria-label="Админ меню">
        <a class="active" href="admin.html">Заявки</a>
        <a href="index.html">Открыть сайт</a>
        <a href="projects.html">Портфолио</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-top">
        <div>
          <p class="section-kicker">Админ-панель</p>
          <h1>Заявки с сайта</h1>
          <p class="lead">Здесь отображаются обращения, отправленные через кнопку «Связаться» на главном сайте.</p>
        </div>
        <a class="btn subtle" href="index.html#contact">Добавить тестовую заявку</a>
      </div>

      <section class="admin-cards" aria-label="Статистика заявок">
        <div class="admin-card"><b data-total>0</b><span>Всего</span></div>
        <div class="admin-card"><b data-new>0</b><span>Новые</span></div>
        <div class="admin-card"><b data-work>0</b><span>В работе</span></div>
        <div class="admin-card"><b data-done>0</b><span>Закрытые</span></div>
      </section>

      <div class="admin-tools">
        <input type="search" placeholder="Поиск по имени, телефону, сообщению" data-search>
        <select data-filter>
          <option value="all">Все статусы</option>
          <option value="new">Новые</option>
          <option value="work">В работе</option>
          <option value="done">Закрытые</option>
        </select>
        <button class="btn subtle" type="button" data-export>Скачать CSV</button>
        <button class="btn" type="button" data-seed>Пример заявки</button>
        <button class="btn" type="button" data-clear>Очистить</button>
      </div>

      <div data-admin-content></div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
